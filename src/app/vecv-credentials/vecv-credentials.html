<div class="bgVECV">
    <img class="logoVECV" src="./../../assets/logoVECV.jpeg" alt="My Eicher logo" />
    <div class="login-box">
        <p>Sign-in with your organizational account</p>
    <div class="userId">
        <label for="user">User Id</label>
        <div><input type="text" placeholder="someone@example.com" [formControl]="userIdControl" [(ngModel)]="username"></div>
    </div>
    <div class="password">
        <label for="pass">Password</label>
        <div><input type="password" placeholder="Password" id="pass" [formControl]="passwordControl" [(ngModel)]="password"></div>
    </div>
    <button class="sign-upbtn" [disabled]="userIdControl.invalid || passwordControl.invalid" (click)="onSignIn()">Sign In</button>
    <p class = "sign-inVECV">Sign-in to VECV Network using your User ID <b>(username@vecvnet.com)</b>. 
        Contact <span style="color:red;">Helpdesk</span> for more information.
    </p>
    <p class="needHelp" (click)="goBack()">Go Back</p>
</div>

</div>
