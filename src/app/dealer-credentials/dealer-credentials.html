<div class="bg">
    <div class="bg-slides">
        <div class="bg-slide" *ngFor="let img of images; let i = index" [class.active]="currentIndex() === i"
            [class.prev]="prevIndex() === i && prevIndex() !== currentIndex()"
            [class.hidden]="currentIndex() !== i && (prevIndex() !== i || prevIndex() === currentIndex())"
            [style.background-image]="'url(' + img + ')'">
        </div>
    </div>

    <div class="shadow"></div>

    <nav class="navbar">
        <a class="navbar-brand">
            <img class="my-eicher-logo" src="/assets/logo.svg" alt="My Eicher logo" />
            <!-- <img class="logoVECV" src="./../../assets/logoVECV.jpeg" alt="My Eicher logo" /> -->
        </a>
    </nav>

    <div class="login-box">
        <div class="welcome">
            <h2>Welcome to My Eicher!</h2>
            <p>Your connected Fleet Management System</p>
        </div>
        <p>Sign-in with your dealer account</p>
        <div class="userId">
            <label for="user">Dealer Id</label>
            <div><input type="text" placeholder="Enter your Dealer ID" [formControl]="userIdControl" [(ngModel)]="dealerId"></div>
        </div>
        <div class="password">
            <label for="pass">Password</label>
            <div><input type="password" placeholder="Password" id="pass" [formControl]="passwordControl" [(ngModel)]="password"></div>
        </div>
        <button class="sign-upbtn" [disabled]="userIdControl.invalid || passwordControl.invalid" (click)="onDealerLogin()">Sign
            In</button>
        <p class="needHelp" (click)="goBack()">Go Back</p>
    </div>


</div>
